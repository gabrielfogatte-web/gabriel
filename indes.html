<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Site</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            text-align: center;
            padding: 50px;
        }

        .container {
            background: white;
            max-width: 500px;
            margin: auto;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
        }

        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Olá, Mundo! 👋</h1>
        <p>Esta é uma página HTML com CSS e JavaScript.</p>

        <button onclick="mostrarMensagem()">
            Clique Aqui
        </button>

        <p id="resultado"></p>
    </div>

    <script>
        function mostrarMensagem() {
            document.getElementById("resultado").innerHTML =
                "Você clicou no botão!";
        }
    </script>

</body>
</html>
